<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Tunes - YouTube Music Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #d946ef;
            --primary-dark: #a21caf;
            --bg-dark: #0f0715;
            --bg-gradient: linear-gradient(135deg, #1e0b2e 0%, #000000 100%);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --nav-height: 70px;
            --mini-player-height: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Hidden YouTube Player --- */
        #hidden-player-wrapper {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- UI Components --- */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
        }
        .btn-icon:active { transform: scale(0.9); }

        img.cover-art { object-fit: cover; }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 50;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #c084fc, #f0abfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* --- Side Menu --- */
        #side-menu {
            position: fixed;
            top: 0; left: -100%;
            width: 250px;
            height: 100%;
            background: rgba(10, 5, 20, 0.95);
            backdrop-filter: blur(20px);
            z-index: 200;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid var(--glass-border);
        }
        #side-menu.active { left: 0; }
        .menu-item {
            padding: 15px;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .close-menu { align-self: flex-end; margin-bottom: 20px; }
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 199;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #menu-overlay.active { opacity: 1; pointer-events: auto; }

        /* --- Main Content Areas --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding-bottom: calc(var(--nav-height) + var(--mini-player-height) + 20px);
            position: relative;
        }
        
        .page {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .page.active { display: block; }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 20px 0 15px 0;
            color: var(--text-main);
        }

        /* --- Cards & List --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            overflow-x: auto;
        }
        .song-card {
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
            cursor: pointer;
        }
        .song-card:active { transform: scale(0.98); background: rgba(255,255,255,0.15); }
        .song-card img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background: #222;
        }
        .song-card h4 { font-size: 0.9rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-card p { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .song-list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
        }
        .song-list-item:active { background: rgba(255,255,255,0.15); }
        .song-list-item img {
            width: 50px; height: 50px;
            border-radius: 8px;
            margin-right: 15px;
            background: #222;
        }
        .song-info { flex: 1; overflow: hidden; }
        .song-info h4 { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        /* --- Search --- */
        .search-bar-container {
            position: sticky; top: 0;
            background: var(--bg-dark);
            z-index: 10;
            padding-bottom: 15px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #1f1b29;
            border-radius: 20px;
            padding: 0 15px;
            height: 45px;
            border: 1px solid #333;
        }
        .search-box input {
            background: none; border: none; outline: none;
            color: white; flex: 1; margin-left: 10px;
            font-size: 1rem;
        }

        /* --- Mini Player --- */
        #mini-player {
            position: fixed;
            bottom: var(--nav-height);
            left: 10px; right: 10px;
            height: var(--mini-player-height);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 90;
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        #mini-player.visible { transform: translateY(-10px); }
        
        .mini-art {
            width: 40px; height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .mini-art.playing { animation-play-state: running; }
        
        .mini-info { flex: 1; overflow: hidden; }
        .mini-info h4 { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-info p { font-size: 0.75rem; color: var(--text-muted); }

        /* --- Bottom Nav --- */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: var(--nav-height);
            background: rgba(15, 7, 21, 0.9);
            backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); font-size: 0.75rem; gap: 4px;
            transition: 0.3s;
        }
        .nav-item i { font-size: 1.4rem; }
        .nav-item.active { color: var(--primary); }

        /* --- Full Player Overlay --- */
        #full-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 300;
            display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        #full-player.active { transform: translateY(0); }
        
        .fp-bg {
            position: absolute; width: 100%; height: 100%;
            opacity: 0.4; filter: blur(50px);
            z-index: -1;
        }
        
        .fp-header {
            display: flex; justify-content: space-between;
            padding: 20px; align-items: center; margin-top: 20px;
        }
        
        .fp-art-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .fp-art {
            width: 280px; height: 280px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(217, 70, 239, 0.3);
            border: 4px solid rgba(255,255,255,0.1);
            animation: spin 15s linear infinite;
            animation-play-state: paused;
        }
        .fp-art.playing { animation-play-state: running; }
        .fp-center-hole {
            position: absolute; width: 40px; height: 40px;
            background: #1a0b2e; border-radius: 50%;
            border: 2px solid var(--text-muted);
        }

        .fp-info { text-align: center; padding: 20px; }
        .fp-title { font-size: 1.4rem; margin-bottom: 5px; font-weight: 700; max-height: 60px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .fp-artist { color: var(--primary); font-size: 1rem; }

        .fp-controls-container { padding: 20px 30px 50px 30px; }
        
        .progress-area { margin-bottom: 25px; }
        .progress-bar {
            width: 100%; height: 5px; background: rgba(255,255,255,0.2);
            border-radius: 5px; position: relative; cursor: pointer;
        }
        .progress-fill {
            height: 100%; background: var(--primary); width: 0%;
            border-radius: 5px; position: relative;
        }
        .progress-fill::after {
            content: ''; position: absolute; right: -6px; top: -4px;
            width: 14px; height: 14px; background: white;
            border-radius: 50%; box-shadow: 0 0 10px var(--primary);
        }
        .time-stamps {
            display: flex; justify-content: space-between;
            font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;
        }

        .main-controls {
            display: flex; justify-content: space-between; align-items: center;
        }
        .play-btn-lg {
            width: 70px; height: 70px;
            background: var(--primary);
            border-radius: 50%;
            color: white; font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
            cursor: pointer;
        }
        .play-btn-lg:active { transform: scale(0.95); }
        .liked { color: #ef4444; animation: pulse 0.3s; }

        /* Loader */
        .loader {
            text-align: center; padding: 20px; color: var(--primary);
            display: none;
        }
    </style>
</head>
<body>

    <div id="hidden-player-wrapper">
        <div id="youtube-iframe-placeholder"></div>
    </div>

    <div id="menu-overlay"></div>
    <div id="side-menu">
        <button class="btn-icon close-menu"><i class="fa-solid fa-xmark"></i></button>
        <div class="menu-item"><i class="fa-solid fa-circle-info"></i> About AR Tunes</div>
        <div class="menu-item"><i class="fa-solid fa-code-branch"></i> Version 2.0 (YT)</div>
        <div class="menu-item"><i class="fa-solid fa-headset"></i> Help & Support</div>
    </div>

    <header>
        <button class="btn-icon" id="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="logo">AR Tunes</div>
        <div style="width: 40px;"></div>
    </header>

    <main>
        <div id="home" class="page active">
            <h3 class="section-title">Trending Bollywood</h3>
            <div class="loader" id="home-loader"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <div class="card-grid" id="trending-container"></div>
            
            <h3 class="section-title">New Indian Releases</h3>
            <div id="new-releases-list"></div>
        </div>

        <div id="search" class="page">
            <div class="search-bar-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: #666;"></i>
                    <input type="text" id="search-input" placeholder="Search Youtube Music...">
                </div>
            </div>
            <div class="loader" id="search-loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
            <div id="search-results">
                <div style="text-align: center; margin-top: 50px; color: #555;">
                    <i class="fa-brands fa-youtube fa-3x" style="margin-bottom: 10px;"></i>
                    <p>Search any song from YouTube</p>
                </div>
            </div>
        </div>

        <div id="favorites" class="page">
            <h3 class="section-title">Your Liked Songs</h3>
            <div id="favorites-list"></div>
            <div id="empty-favs" style="text-align: center; margin-top: 50px; color: #555; display: none;">
                <p>No favorites yet.</p>
            </div>
        </div>
    </main>

    <div id="mini-player" class="glass">
        <img src="https://via.placeholder.com/100" class="cover-art mini-art" id="mini-art">
        <div class="mini-info">
            <h4 id="mini-title">Select a Song</h4>
            <p id="mini-artist">AR Tunes</p>
        </div>
        <button class="btn-icon" id="mini-play-btn"><i class="fa-solid fa-play"></i></button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-target="home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" data-target="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
        <div class="nav-item" data-target="favorites">
            <i class="fa-solid fa-heart"></i>
            <span>Favorites</span>
        </div>
    </nav>

    <div id="full-player">
        <img src="" class="fp-bg" id="fp-bg-img">
        
        <div class="fp-header">
            <button class="btn-icon" id="close-fp"><i class="fa-solid fa-chevron-down"></i></button>
            <div style="font-size: 0.8rem; letter-spacing: 1px; color: #ccc;">NOW PLAYING</div>
            <button class="btn-icon"><i class="fa-solid fa-ellipsis"></i></button>
        </div>

        <div class="fp-art-container">
            <img src="" class="cover-art fp-art" id="fp-art">
            <div class="fp-center-hole"></div>
        </div>

        <div class="fp-info">
            <h2 class="fp-title" id="fp-title">Song Title</h2>
            <p class="fp-artist" id="fp-artist">Artist Name</p>
            <button class="btn-icon" id="like-btn" style="font-size: 1.5rem; margin-top: 10px;"><i class="fa-regular fa-heart"></i></button>
        </div>

        <div class="fp-controls-container">
            <div class="progress-area">
                <div class="progress-bar" id="progress-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-stamps">
                    <span id="curr-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <button class="btn-icon" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="btn-icon" id="prev-btn" style="font-size: 1.5rem;"><i class="fa-solid fa-backward-step"></i></button>
                <div class="play-btn-lg" id="fp-play-btn">
                    <i class="fa-solid fa-play"></i>
                </div>
                <button class="btn-icon" id="next-btn" style="font-size: 1.5rem;"><i class="fa-solid fa-forward-step"></i></button>
                <button class="btn-icon" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const API_KEY = 'AIzaSyC79iU5RWU9rz98aio2NT2Pb6O49mph0LY'; // PROVIDED KEY

        // --- STATE ---
        const state = {
            queue: [],
            currentIndex: 0,
            isPlaying: false,
            favorites: JSON.parse(localStorage.getItem('arTunesFavs')) || [],
            shuffle: false,
            repeat: false,
            ytPlayer: null,
            timer: null
        };
        
        // --- DOM ---
        const els = {
            home: document.getElementById('home'),
            search: document.getElementById('search'),
            favorites: document.getElementById('favorites'),
            navItems: document.querySelectorAll('.nav-item'),
            trending: document.getElementById('trending-container'),
            newReleases: document.getElementById('new-releases-list'),
            searchResults: document.getElementById('search-results'),
            favoritesList: document.getElementById('favorites-list'),
            searchInput: document.getElementById('search-input'),
            miniPlayer: document.getElementById('mini-player'),
            fullPlayer: document.getElementById('full-player'),
            // Player UI
            miniArt: document.getElementById('mini-art'),
            miniTitle: document.getElementById('mini-title'),
            miniArtist: document.getElementById('mini-artist'),
            miniPlayBtn: document.getElementById('mini-play-btn'),
            fpArt: document.getElementById('fp-art'),
            fpBg: document.getElementById('fp-bg-img'),
            fpTitle: document.getElementById('fp-title'),
            fpArtist: document.getElementById('fp-artist'),
            fpPlayBtn: document.getElementById('fp-play-btn'),
            progressFill: document.getElementById('progress-fill'),
            currTime: document.getElementById('curr-time'),
            totalTime: document.getElementById('total-time'),
            likeBtn: document.getElementById('like-btn')
        };

        // --- YOUTUBE API SETUP ---
        // Load IFrame API asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            state.ytPlayer = new YT.Player('youtube-iframe-placeholder', {
                height: '0',
                width: '0', // HIDE VIDEO
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log("YouTube Player Ready");
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED = 0, PLAYING = 1, PAUSED = 2
            if (event.data === YT.PlayerState.ENDED) {
                if (state.repeat) {
                    state.ytPlayer.seekTo(0);
                    state.ytPlayer.playVideo();
                } else {
                    nextTrack();
                }
            } else if (event.data === YT.PlayerState.PLAYING) {
                state.isPlaying = true;
                updatePlayPauseIcons();
                startTimer();
                // Get duration once playing starts
                const duration = state.ytPlayer.getDuration();
                els.totalTime.innerText = formatTime(duration);
            } else if (event.data === YT.PlayerState.PAUSED) {
                state.isPlaying = false;
                updatePlayPauseIcons();
                stopTimer();
            }
        }

        // --- API FETCHING ---
        async function searchYouTube(query, maxResults = 10) {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&q=${encodeURIComponent(query)}&maxResults=${maxResults}&key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.error) {
                    console.error(data.error);
                    return [];
                }
                return data.items.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title,
                    artist: item.snippet.channelTitle,
                    cover: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                }));
            } catch (error) {
                console.error("Fetch error:", error);
                return [];
            }
        }

        // --- RENDERING ---
        function createCard(song, index, originQueue) {
            const div = document.createElement('div');
            div.className = 'song-card glass';
            div.innerHTML = `
                <img src="${song.cover}" alt="art">
                <h4>${song.title}</h4>
                <p>${song.artist}</p>
            `;
            div.onclick = () => loadQueueAndPlay(originQueue, index);
            return div;
        }

        function createListItem(song, index, originQueue) {
            const div = document.createElement('div');
            div.className = 'song-list-item glass';
            div.innerHTML = `
                <img src="${song.cover}" alt="art">
                <div class="song-info">
                    <h4>${song.title}</h4>
                    <p>${song.artist}</p>
                </div>
                <button class="btn-icon"><i class="fa-solid fa-play"></i></button>
            `;
            div.onclick = () => loadQueueAndPlay(originQueue, index);
            return div;
        }

        async function initHome() {
            document.getElementById('home-loader').style.display = 'block';
            
            // Fetch Trending (Simulated by search query)
            const trendSongs = await searchYouTube('Trending Hindi Music', 6);
            els.trending.innerHTML = '';
            trendSongs.forEach((song, i) => els.trending.appendChild(createCard(song, i, trendSongs)));

            // Fetch New Releases
            const newSongs = await searchYouTube('Latest Indian Songs', 10);
            els.newReleases.innerHTML = '';
            newSongs.forEach((song, i) => els.newReleases.appendChild(createListItem(song, i, newSongs)));

            document.getElementById('home-loader').style.display = 'none';
        }

        function renderFavorites() {
            els.favoritesList.innerHTML = '';
            if(state.favorites.length === 0) {
                document.getElementById('empty-favs').style.display = 'block';
            } else {
                document.getElementById('empty-favs').style.display = 'none';
                state.favorites.forEach((song, i) => {
                    els.favoritesList.appendChild(createListItem(song, i, state.favorites));
                });
            }
        }

        // --- PLAYER LOGIC ---
        function loadQueueAndPlay(newQueue, index) {
            state.queue = newQueue;
            state.currentIndex = index;
            const song = state.queue[state.currentIndex];
            
            if (state.ytPlayer && state.ytPlayer.loadVideoById) {
                state.ytPlayer.loadVideoById(song.id);
            }
            
            updatePlayerUI(song);
            els.miniPlayer.classList.add('visible');
        }

        function updatePlayerUI(song) {
            els.miniTitle.innerText = song.title;
            els.miniArtist.innerText = song.artist;
            els.fpTitle.innerText = song.title;
            els.fpArtist.innerText = song.artist;

            els.miniArt.src = song.cover;
            els.fpArt.src = song.cover;
            els.fpBg.src = song.cover;

            const isFav = state.favorites.some(f => f.id === song.id);
            els.likeBtn.innerHTML = isFav ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
            els.likeBtn.classList.toggle('liked', isFav);
        }

        function updatePlayPauseIcons() {
            const icon = state.isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
            els.miniPlayBtn.innerHTML = icon;
            els.fpPlayBtn.innerHTML = icon;
            
            if(state.isPlaying) {
                els.miniArt.classList.add('playing');
                els.fpArt.classList.add('playing');
            } else {
                els.miniArt.classList.remove('playing');
                els.fpArt.classList.remove('playing');
            }
        }

        function togglePlay() {
            if (!state.ytPlayer) return;
            if (state.isPlaying) {
                state.ytPlayer.pauseVideo();
            } else {
                state.ytPlayer.playVideo();
            }
        }

        function nextTrack() {
            if(state.queue.length === 0) return;
            if(state.shuffle) {
                state.currentIndex = Math.floor(Math.random() * state.queue.length);
            } else {
                state.currentIndex = (state.currentIndex + 1) % state.queue.length;
            }
            loadQueueAndPlay(state.queue, state.currentIndex);
        }

        function prevTrack() {
            if(state.queue.length === 0) return;
            state.currentIndex = (state.currentIndex - 1 + state.queue.length) % state.queue.length;
            loadQueueAndPlay(state.queue, state.currentIndex);
        }

        // --- TIMERS & SEEK ---
        function startTimer() {
            stopTimer();
            state.timer = setInterval(() => {
                if(state.ytPlayer && state.ytPlayer.getCurrentTime) {
                    const current = state.ytPlayer.getCurrentTime();
                    const duration = state.ytPlayer.getDuration();
                    if(duration > 0) {
                        const pct = (current / duration) * 100;
                        els.progressFill.style.width = pct + '%';
                        els.currTime.innerText = formatTime(current);
                    }
                }
            }, 500);
        }

        function stopTimer() {
            if(state.timer) clearInterval(state.timer);
        }

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        // Seek Bar Click
        document.getElementById('progress-container').addEventListener('click', (e) => {
            if(!state.ytPlayer) return;
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            const duration = state.ytPlayer.getDuration();
            const seekTime = (clickX / width) * duration;
            state.ytPlayer.seekTo(seekTime, true);
        });

        // --- FAVORITES ---
        els.likeBtn.onclick = () => {
            const song = state.queue[state.currentIndex];
            if(!song) return;
            const index = state.favorites.findIndex(f => f.id === song.id);
            if(index > -1) {
                state.favorites.splice(index, 1);
            } else {
                state.favorites.push(song);
            }
            localStorage.setItem('arTunesFavs', JSON.stringify(state.favorites));
            updatePlayerUI(song);
            renderFavorites();
        };

        // --- EVENT LISTENERS ---
        els.navItems.forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                els.navItems.forEach(n => n.classList.remove('active'));
                const target = item.dataset.target;
                document.getElementById(target).classList.add('active');
                item.classList.add('active');
                if(target === 'favorites') renderFavorites();
            });
        });

        els.searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = els.searchInput.value;
                if(!query) return;
                document.getElementById('search-loader').style.display = 'block';
                els.searchResults.innerHTML = '';
                const results = await searchYouTube(query);
                document.getElementById('search-loader').style.display = 'none';
                if(results.length === 0) {
                    els.searchResults.innerHTML = '<div style="text-align:center; padding:20px;">No results found or Quota Exceeded.</div>';
                } else {
                    results.forEach((song, i) => els.searchResults.appendChild(createListItem(song, i, results)));
                }
            }
        });

        els.miniPlayBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
        els.fpPlayBtn.onclick = togglePlay;
        els.miniPlayer.onclick = () => els.fullPlayer.classList.add('active');
        document.getElementById('close-fp').onclick = () => els.fullPlayer.classList.remove('active');
        document.getElementById('next-btn').onclick = nextTrack;
        document.getElementById('prev-btn').onclick = prevTrack;
        document.getElementById('shuffle-btn').onclick = (e) => {
            state.shuffle = !state.shuffle;
            e.currentTarget.style.color = state.shuffle ? '#d946ef' : 'white';
        };
        document.getElementById('repeat-btn').onclick = (e) => {
            state.repeat = !state.repeat;
            e.currentTarget.style.color = state.repeat ? '#d946ef' : 'white';
        };

        // Menu
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const closeMenu = document.querySelector('.close-menu');
        function toggleMenu() { sideMenu.classList.toggle('active'); menuOverlay.classList.toggle('active'); }
        menuBtn.onclick = toggleMenu;
        closeMenu.onclick = toggleMenu;
        menuOverlay.onclick = toggleMenu;

        // Init
        initHome();

    </script>
</body>
</html>
